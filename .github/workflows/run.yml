name: promo-notifier

on:
  schedule:
    # Mardi : nouveau folder Intermarché (mar → dim).
    # Jeudi : nouvelle semaine Delhaize (jeu → mer).
    - cron: "0 6 * * 2"
    - cron: "0 6 * * 4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Afficher le récap sans envoyer d'e-mail"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: promo-notifier
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer
        run: pip install .

      - name: Récupérer, filtrer, notifier
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: promo-notifier ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Préparer la page filtrable
        if: always() && hashFiles('site/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Même si une source a échoué, on mémorise les promos déjà notifiées
      # et le dépliant Colruyt analysé (cache, aussi en dry run pour ne pas payer deux fois).
      - name: Mémoriser l'état
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "state: mise à jour $(date -u +%F)"
          git push

  # Publie site/index.html sur GitHub Pages (Settings → Pages → Source : GitHub Actions).
  page:
    needs: run
    if: always() && needs.run.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
