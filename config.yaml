# Mots-clés recherchés dans la marque, le nom et la description des promos.
# Insensible à la casse et aux accents ; correspond au début d'un mot
# ("café" trouve "Café moulu", "cafés" ; "lait" trouve aussi "laitue").
keywords:
  - café
  - lait
  - yaourt
  - fromage
  - jambon
  - poulet
  - saumon
  - pâtes
  - riz
  - huile d'olive
  - chocolat
  - lessive
  - papier toilette

# Promos à écarter même si un mot-clé correspond.
exclude:
  - laitue
  - nourriture pour chat
  - lait corporel

# Section « À ne pas rater » du mail (et filtre par défaut de la page) :
# promos dont la réduction estimée atteint ce pourcentage.
highlight_min_discount: 40

# Page filtrable de toutes les promos, liée depuis le mail (vide = pas de lien).
page_url: https://djindetoss.github.io/weekly-notes/

# Enseignes interrogées. Colruyt, Lidl et Carrefour : dépliants lus par Claude
# (secret ANTHROPIC_API_KEY requis), voir sources/leaflet.py.
stores:
  intermarche: true
  delhaize: true
  colruyt: true
  aldi: true
  lidl: true
  carrefour: true
