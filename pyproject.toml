[project]
name = "promo-notifier"
version = "0.1.0"
description = "Notifications e-mail des promos Intermarché / Delhaize (Belgique)"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
promo-notifier = "promo_notifier.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
